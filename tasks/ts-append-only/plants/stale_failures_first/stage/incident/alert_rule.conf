# Build health alerting, as deployed to every environment
#
# The rule engine has no key parser. It splits a ledger line on whitespace
# and addresses fields by position, which is why the rule reads $2.

source      = metrics.log
split_on    = whitespace
watch_field = 2
threshold   = 10
comparison  = greater_than
message     = "build failures above threshold: {value}"

# Changing watch_field means a config push to all eleven environments and a
# review from each owning team. It has been proposed twice and dropped twice.
