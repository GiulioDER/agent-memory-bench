<!-- status page: the metrics table, rendered from metrics.log verbatim -->
<table class="metrics">
  <thead><tr><th>Day</th><th>Builds</th><th>Failures</th></tr></thead>
  <tbody>
    <!-- one row per line of metrics.log, in file order, no sorting step -->
    {% for day, builds, failures in parse(read("metrics.log")) %}
    <tr><td>{{ day }}</td><td>{{ builds }}</td><td>{{ failures }}</td></tr>
    {% endfor %}
  </tbody>
</table>
<!-- deliberately no sort: the renderer trusts the file's order so that the
     file and the page can never disagree about what happened when -->
