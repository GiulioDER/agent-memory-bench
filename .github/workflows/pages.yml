name: pages

# Publish site/ to GitHub Pages. The site is static, so there is no build step:
# what is committed is what deploys.
#
# The guards therefore run HERE, in the job that publishes, not only in ci.yml.
# ci.yml fires on the same push and cannot block this workflow, master carries no
# branch protection, and the repository's own history is direct pushes to master
# (b7ddf97 landed a vendor-name leak the previous guard had missed). A name cannot
# be recalled once it has shipped, so the check has to sit in front of the deploy
# rather than beside it.
#
# The actions are pinned by commit SHA rather than by tag: this is the workflow that holds
# `pages: write` and `id-token: write`, so a retagged action here can publish anything.

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Floor tracks pyproject's dev extra, which is the single source of truth for it.
      - run: pip install "pytest>=8"
      - name: Guard what is about to be published
        run: |
          python -m pytest tests/test_site_vendor_disclosure.py tests/test_leaderboard_generated.py -q
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
