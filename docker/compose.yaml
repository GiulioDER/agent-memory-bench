# One-command reproduction. Credentials come from ../.env (never committed).
#
# Services for self-hosted arms join this file with their adapters in Phase 3:
#   falkordb   (zep/graphiti backend)
#   litellm    (metering proxy: adapter extraction traffic, tagged per arm)
services:
  harness:
    build:
      context: ..
      dockerfile: docker/Dockerfile.harness
    env_file:
      - ../.env
    volumes:
      - ../results:/bench/results
      # `.git` is excluded from the image (see .dockerignore: history and any nested checkout
      # must not be baked into a layer), but the preregistration guard shells out to
      # `git status -- preregistration` and refuses to run a measured session without it.
      # Mounting it read-only keeps both properties: no history in the image, a working guard
      # at run time.
      - ../.git:/bench/.git:ro
    depends_on:
      - recall-db
    networks:
      - default
      - amb-broker-net

  # These services only build and tag the trusted images. The controller creates one disposable
  # participant and one disposable checker per session, so neither service is a participant
  # workload and neither receives the repository as a runtime mount.
  participant-image:
    build:
      context: ./participant
      dockerfile: ../Dockerfile.participant
    image: agent-memory-bench-participant:2.1.221
    profiles: ["images"]
    network_mode: none

  checker-image:
    build:
      context: ..
      dockerfile: docker/Dockerfile.checker
    image: agent-memory-bench-checker:trusted
    profiles: ["images"]
    network_mode: none

  model-broker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.broker
    image: agent-memory-bench-model-broker:trusted
    profiles: ["brokers"]
    env_file:
      - ../.env
    environment:
      AMB_BROKER_SERVICE: model
      AMB_BROKER_PORT: 8080
      AMB_BROKER_METHODS: messages
      AMB_BROKER_RUN_ID: "*"
      AMB_BROKER_ARM: "*"
      AMB_BROKER_NAMESPACE: "*"
      AMB_BROKER_UPSTREAM_URL: ${AMB_MODEL_BROKER_UPSTREAM_URL:?AMB_MODEL_BROKER_UPSTREAM_URL must be set}
      AMB_BROKER_UPSTREAM_CREDENTIAL: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set}
      AMB_BROKER_UPSTREAM_ALLOWLIST: https://openrouter.ai/
      AMB_EGRESS_PROXY_URL: http://egress-proxy:3128
    networks:
      - amb-broker-net
      - amb-egress-net

  memory-broker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.broker
    image: agent-memory-bench-memory-broker:trusted
    profiles: ["brokers"]
    env_file:
      - ../.env
    environment:
      AMB_BROKER_SERVICE: memory
      AMB_BROKER_PORT: 8080
      AMB_BROKER_METHODS: initialize,tools/list,tools/call
      AMB_BROKER_RUN_ID: "*"
      AMB_BROKER_ARM: "*"
      AMB_BROKER_NAMESPACE: "*"
      AMB_BROKER_UPSTREAM_URL: ${AMB_MEMORY_BROKER_UPSTREAM_URL:?AMB_MEMORY_BROKER_UPSTREAM_URL must be set}
      AMB_BROKER_UPSTREAM_ALLOWLIST: ${AMB_MEMORY_BROKER_UPSTREAM_ALLOWLIST:?AMB_MEMORY_BROKER_UPSTREAM_ALLOWLIST must be set}
      AMB_EGRESS_PROXY_URL: http://egress-proxy:3128
    networks:
      - amb-broker-net
      - amb-egress-net

  egress-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.egress-proxy
    image: agent-memory-bench-egress-proxy:trusted
    profiles: ["brokers"]
    env_file:
      - ../.env
    environment:
      AMB_EGRESS_PORT: 3128
    networks:
      - amb-egress-net

  recall-db:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: bench
      # Fail closed. A password baked into this file is reused in local databases and can also
      # be copied into generated DSNs or support artifacts.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: bench
    # No host port on purpose: only the harness container reaches it, and a benchmark
    # database must never be reachable by (or confusable with) anything else on the host.
    volumes:
      - recall-db-data:/var/lib/postgresql/data

volumes:
  recall-db-data:

networks:
  # Participant sessions may reach only broker endpoints on this dedicated network. The
  # controller must attach the egress proxy and brokers explicitly when deploying on Linux.
  amb-broker-net:
    name: amb-broker-net
    internal: true
  # The checker is created with Docker's network=none and is intentionally not attached here.
  amb-checker-net:
    name: amb-checker-net
    internal: true
  amb-egress-net:
    name: amb-egress-net
