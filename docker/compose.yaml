# One-command reproduction. Credentials come from ../.env (never committed).
#
# Services for self-hosted arms join this file with their adapters in Phase 3:
#   falkordb   (zep/graphiti backend)
#   litellm    (metering proxy: adapter extraction traffic, tagged per arm)
services:
  harness:
    build:
      context: ..
      dockerfile: docker/Dockerfile.harness
    env_file:
      - ../.env
    volumes:
      - ../results:/bench/results
    depends_on:
      - recall-db

  recall-db:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: bench
      # Fail closed. A password baked into this file is reused in local databases and can also
      # be copied into generated DSNs or support artifacts.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: bench
    # No host port on purpose: only the harness container reaches it, and a benchmark
    # database must never be reachable by (or confusable with) anything else on the host.
    volumes:
      - recall-db-data:/var/lib/postgresql/data

volumes:
  recall-db-data:
