[project]
name = "agent-memory-bench"
version = "0.0.1"
description = "A preregistered, execution-graded benchmark of pluggable memory layers for Claude Code, measured by task success on real coding tasks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Each product arm's dependencies are installed only when that arm runs, and are pinned in
# adapters/<name>/versions.lock at the preregistration freeze. Nothing here, on purpose:
# the harness itself is stdlib-only so a reviewer can read it without an environment.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py312"
# Recorded agent output, kept verbatim as evidence of what a session with no memory produces.
# Linting it would be meaningless, and `ruff --fix` would EDIT the artefact a damage detector is
# tested against, silently changing what the fourth assertion in tests/test_damage_detection.py
# has seen.
# A plant's staged incident is EVIDENCE a recording session reasons from, not project code. It
# is deliberately fragmentary: a snippet of a consumer that calls functions defined nowhere is
# what a real incident directory looks like, and `ruff --fix` would edit the material a recorded
# plant was produced from, changing what the corpus contains.
extend-exclude = ["tests/fixtures/factless-sessions", "tasks/*/plants/*/stage"]

[tool.ruff.lint]
ignore = ["E402"]
